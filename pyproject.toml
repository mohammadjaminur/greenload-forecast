[project]
name = "greenload"
version = "0.1.0"
description = "GRU-based demand/price/water/carbon forecasting driving a convex MPC scheduler for water- and carbon-aware datacenter workload placement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohammad Jaminur Islam" }]
dependencies = [
  "torch>=2.2",
  "cvxpy>=1.4",
  "scipy>=1.13",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
